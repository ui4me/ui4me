[package]
name = "ui4me-core"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The ui4me native application runtime and document renderer"
publish = false
build = "build.rs"

[lib]
name = "ui4me_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
native = ["dep:winit", "dep:softbuffer", "dep:arboard", "dep:rfd", "dep:accesskit_winit", "dep:zbus", "dep:windows-sys"]

[dependencies]
serde_json = "=1.0.154"
serde = { version = "1", features = ["derive"] }
ui4me-renderer = { path = "../ui4me-renderer" }
arboard = { version = "=3.6.1", optional = true, default-features = false, features = ["wayland-data-control"] }
png = "=0.18.1"
# Print jobs and PDF export compress page images (already in the tree through png).
miniz_oxide = "=0.8.9"
url.workspace = true
# Native file dialogs: xdg-desktop-portal over a dlopen'd libdbus on Linux, IFileDialog on Windows.
# Screen-reader bridge: AT-SPI (accesskit_unix, async-io) on Linux, UI Automation on Windows.
accesskit_winit = { version = "=0.34.2", optional = true, default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"] }
rfd = { version = "=0.18.0", optional = true, default-features = false, features = ["xdg-portal"] }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "=0.4.8", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

# Desktop services (0.7): D-Bus notifications, tray, portal shortcuts/settings (zbus is already
# in the tree through accesskit_unix) and the Win32 shell/menus/hotkeys (windows-sys through arboard).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", optional = true, default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.59.0", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }
