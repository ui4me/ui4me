[package]
name = "ui4me-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The ui4me application lifecycle and minimal native renderer"
publish = false
build = "build.rs"

[lib]
name = "ui4me_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
native = ["dep:winit", "dep:softbuffer"]

[dependencies]
serde_json = "=1.0.154"
font8x8 = "=0.3.1"
png = "=0.17.16"
winit = { version = "=0.30.12", optional = true, default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "=0.4.6", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
