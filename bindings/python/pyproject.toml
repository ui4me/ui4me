[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ui4me"
version = "0.1.0"
description = "A small native UI runtime for Python and PowerShell"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{name = "ui4me contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://ui4me.github.io/"
Repository = "https://github.com/ui4me/ui4me"
Issues = "https://github.com/ui4me/ui4me/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ui4me = ["_native/*", "_notices/*", "_notices/licenses/*/*", "resources/*.html", "py.typed"]
