[workspace]
members = ["crates/ui4me-core", "crates/ui4me-document", "crates/ui4me-renderer", "crates/ui4me-assets", "crates/ui4me-engine-types"]
exclude = ["patches"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ui4me/ui4me"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# document
html5ever = "0.40"
markup5ever = "0.40"
web_atoms = "0.3"
string_cache = "0.11"
# One pinned Stylo revision for the entire family
stylo = { git = "https://github.com/servo/stylo", rev = "37c1ed3b707c8f333304de2107c13b68fbc1057c", features = ["servo"] }
selectors = { git = "https://github.com/servo/stylo", rev = "37c1ed3b707c8f333304de2107c13b68fbc1057c" }
stylo_atoms = { git = "https://github.com/servo/stylo", rev = "37c1ed3b707c8f333304de2107c13b68fbc1057c" }
stylo_static_prefs = { git = "https://github.com/servo/stylo", rev = "37c1ed3b707c8f333304de2107c13b68fbc1057c" }
style_traits = { git = "https://github.com/servo/stylo", rev = "37c1ed3b707c8f333304de2107c13b68fbc1057c", package = "stylo_traits", features = ["servo"] }
stylo_dom = { git = "https://github.com/servo/stylo", rev = "37c1ed3b707c8f333304de2107c13b68fbc1057c" }
cssparser = "0.38"
# API types named by the private style adapter
euclid = "0.22"
app_units = "0.7"
url = "2.5"
# layout
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "fca167cf659b8bf48019d0dea90624109a78103f", default-features = false, features = ["std", "block_layout", "flexbox", "grid", "float_layout", "calc", "content_size"] }
# text
# System font enumeration uses fontconfig on Linux and DirectWrite on Windows.
# `fontconfig-dlopen` loads libfontconfig at run time, so the engine starts (with registered fonts only) where it is missing.
parley = { version = "0.12", default-features = false, features = ["std", "system"] }
fontique = { version = "0.12", default-features = false, features = ["std", "system", "fontconfig-dlopen"] }
# Raster: single-threaded CPU rendering
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "u8_pipeline"] }
# platform
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
# dlopen features avoid a link-time libwayland/libX11 dependency
raw-window-handle = "0.6"
# Serialization and diagnostics
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # correctly rounded float parsing
sha2 = "0.10"
# Local assets: raster codecs, retained SVG backend and data URLs
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
data-url = "0.3"
usvg = { version = "0.49", default-features = false }
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
roxmltree = "0.21"
# WOFF table decompression; flate2 is shared with PNG decoding.
flate2 = "1.1"
brotli-decompressor = { version = "6", default-features = false, features = ["std"] }   # WOFF2
skrifa = "0.44"   # Font inspection and WOFF2 outline comparison
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# test-only
proptest = "1"
jsonschema = { version = "0", default-features = false }

# Internal Rust packages; the public native boundary is crates/ui4me-core.
ui4me-engine-types = { path = "crates/ui4me-engine-types" }
ui4me-document = { path = "crates/ui4me-document" }
ui4me-assets = { path = "crates/ui4me-assets" }
ui4me-renderer = { path = "crates/ui4me-renderer" }

# Exact reviewed upstream source, including the carried corrections.
[patch."https://github.com/servo/stylo"]
stylo = { path = "patches/stylo/stylo/style" }
selectors = { path = "patches/stylo/stylo/selectors" }
stylo_atoms = { path = "patches/stylo/stylo/stylo_atoms" }
stylo_static_prefs = { path = "patches/stylo/stylo/stylo_static_prefs" }
stylo_traits = { path = "patches/stylo/stylo/style_traits" }
stylo_dom = { path = "patches/stylo/stylo/stylo_dom" }
servo_arc = { path = "patches/stylo/stylo/servo_arc" }
to_shmem = { path = "patches/stylo/stylo/to_shmem" }
stylo_malloc_size_of = { path = "patches/stylo/stylo/malloc_size_of" }

# Carried AT-SPI state patch: accesskit_atspi_common 0.21.1 + patches/accesskit_atspi_common/P-013-1
# (aria-expanded and aria-invalid states on Linux; check with patches/accesskit_atspi_common/verify.sh).
[patch.crates-io]
accesskit_atspi_common = { path = "patches/accesskit_atspi_common/accesskit_atspi_common" }

[patch."https://github.com/DioxusLabs/taffy"]
taffy = { path = "patches/taffy/taffy" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.dev.build-override]
opt-level = 0
