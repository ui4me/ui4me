<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI4ME file utility</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 sans-serif; color: #1d2330; background: #f3f5f9; }
  body.dark { color: #e6e9ef; background: #1e2330; }
  body.dark main, body.dark nav { background: #262c3a; }
  header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: #24324a; color: #fff; }
  header h1 { font-size: 15px; margin: 0 auto 0 0; }
  #app { display: flex; gap: 8px; padding: 8px; height: calc(100vh - 82px); }
  nav { width: 240px; flex: none; overflow: auto; background: #fff; border: 1px solid #ccd3df; border-radius: 6px; }
  nav h2, main h2 { font-size: 12px; margin: 0; padding: 6px 8px; color: #55607a; border-bottom: 1px solid #e3e7ee; }
  #entries { list-style: none; margin: 0; padding: 4px 0; }
  #entries li { padding: 2px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; border: 1px solid #ccd3df; border-radius: 6px; }
  #path { padding: 4px 8px; font: 12px monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #55607a; }
  #editor { flex: 1; margin: 0 8px 8px; resize: none; font: 13px/1.4 monospace; padding: 6px; }
  #status { margin: 0; padding: 4px 10px; height: 24px; font-size: 12px; color: #55607a; }
  dialog { border: 1px solid #8892a6; border-radius: 8px; padding: 14px; width: 320px; }
  dialog label { display: block; margin: 8px 0; }
  @media (max-width: 720px) { #app { flex-direction: column; } nav { width: auto; height: 140px; } }
</style>
</head>
<body id="page">
<header>
  <h1>UI4ME file utility</h1>
  <button id="open">Open…</button>
  <button id="save">Save as…</button>
  <button id="folder">Folder…</button>
  <button id="copy">Copy path</button>
  <button id="details">Details</button>
  <button id="settings">Settings</button>
</header>
<div id="app">
  <nav><h2>Folder</h2><ul id="entries"><li>No folder chosen</li></ul></nav>
  <main><h2>File</h2><div id="path">No file open</div><textarea id="editor" placeholder="Open a text file or type here"></textarea></main>
</div>
<p id="status">Ready.</p>
<dialog id="prefs">
  <h3>Settings</h3>
  <label for="theme">Theme</label>
  <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select>
  <label><input id="wrap" type="checkbox" checked> Wrap long lines</label>
  <button id="prefs-close">Close</button>
</dialog>
</body>
</html>
