<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI4ME chat and log</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 sans-serif; color: #1d2330; background: #f3f5f9; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #24324a; color: #fff; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; }
  header input { width: 180px; padding: 4px 6px; }
  main { display: flex; gap: 10px; padding: 10px; height: calc(100vh - 92px); }
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; border: 1px solid #ccd3df; border-radius: 6px; }
  section h2 { font-size: 13px; margin: 0; padding: 6px 10px; border-bottom: 1px solid #e3e7ee; color: #55607a; }
  #msgs, #log { flex: 1; overflow: auto; padding: 6px 10px; }
  #log { font: 12px/1.35 monospace; }
  #log div { white-space: pre-wrap; }
  .msg { margin: 6px 0; padding: 6px 8px; border-radius: 6px; background: #eef2f8; }
  .msg.me { background: #dcefdc; }
  .msg b { display: block; font-size: 12px; color: #55607a; }
  .hit { background: #ffe58a; }
  footer { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid #e3e7ee; }
  footer textarea { flex: 1; height: 44px; padding: 4px 6px; font: inherit; }
  #status { margin: 0; padding: 4px 12px; font-size: 12px; color: #55607a; height: 24px; }
  @media (max-width: 700px) { main { flex-direction: column; } }
</style>
</head>
<body>
<header>
  <h1>UI4ME Core chat · log</h1>
  <input id="search" placeholder="Highlight log lines containing…">
  <button id="copy">Copy selection</button>
  <button id="pause">Pause stream</button>
  <button id="quit">Quit</button>
</header>
<main>
  <section>
    <h2>Conversation</h2>
    <div id="msgs"><p class="msg" id="m0"><b>assistant</b>Hello. Type below and press Enter (Shift+Enter adds a line).</p></div>
    <form id="composer"><footer><textarea id="compose" placeholder="Message"></textarea><button id="send" type="button">Send</button></footer></form>
  </section>
  <section>
    <h2>Log</h2>
    <div id="log"></div>
  </section>
</main>
<p id="status">Ready.</p>
</body>
</html>
