name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (pin qualified ui4me-core 1.0.1 from PyPI)
        run: python -m pip install 'ui4me-core==1.0.1' -e . pytest
      - name: Unit, bridge and real-host (headless) tests
        env:
          UI4ME_ALLOW_UNSUPERVISED: '1'
        run: python -m pytest -q -rs
      - run: python -m compileall -q src
      - run: python tools/sync_skills.py --check

  pester:
    name: Pester / ${{ matrix.shell }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: pwsh }
          - { os: windows-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install UI4ME.Core and Pester 5
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $PWD '.psmodules'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Save-Module -Name UI4ME.Core -MinimumVersion 1.0.1 -MaximumVersion 1.999.999 -Repository PSGallery -Path $dir
          Save-Module -Name Pester -MinimumVersion 5.5.0 -Repository PSGallery -Path $dir
      - name: Run Pester
        run: |
          $ErrorActionPreference = 'Stop'
          $sep = [IO.Path]::PathSeparator
          $env:PSModulePath = (Join-Path $PWD '.psmodules') + $sep + (Join-Path $PWD 'powershell') + $sep + $env:PSModulePath
          Import-Module Pester -MinimumVersion 5.5.0
          $c = New-PesterConfiguration
          $c.Run.Path = './powershell/tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: Example smoke through the real host (headless)
        if: matrix.os == 'ubuntu-latest'
        env:
          UI4ME_UI_SMOKE: '2'
          UI4ME_ALLOW_UNSUPERVISED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sep = [IO.Path]::PathSeparator
          $env:PSModulePath = (Join-Path $PWD '.psmodules') + $sep + (Join-Path $PWD 'powershell') + $sep + $env:PSModulePath
          Import-Module UI4ME
          foreach ($example in Get-ChildItem ./examples/powershell/*.ps1) { Start-UI4MEUiScript -Headless -Path $example.FullName }

  artifacts:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python tools/build_dist.py dist
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Installed wheel works outside the checkout
        env:
          UI4ME_ALLOW_UNSUPERVISED: '1'
        run: |
          python -m venv /tmp/consumer
          /tmp/consumer/bin/pip install dist/*.whl pytest
          cd /tmp && /tmp/consumer/bin/python -c "import ui4me, ui4me_core; assert '/tmp/consumer/' in ui4me.__file__; print(ui4me.__version__, ui4me_core.__version__)"
          cp -r "$GITHUB_WORKSPACE/tests/host" /tmp/host-tests && /tmp/consumer/bin/python -m pytest -q /tmp/host-tests
      - name: PowerShell module loads from the Gallery folder layout (case-sensitive file system)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ([IO.Path]::GetTempPath()) 'gallery-layout'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Save-Module -Name UI4ME.Core -MinimumVersion 1.0.1 -MaximumVersion 1.999.999 -Repository PSGallery -Path $root
          $zip = (Get-Item ./dist/UI4ME-*.zip).FullName
          $version = (Get-Item $zip).BaseName -replace '^UI4ME-', ''
          $staging = Join-Path $root 'zip'
          Expand-Archive -Path $zip -DestinationPath $staging
          # Install-Module/Save-Module put the module in <id>/<version>, where the Gallery id is 'Ui4me'.
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Ui4me') | Out-Null
          Move-Item (Join-Path $staging 'Ui4me') (Join-Path $root "Ui4me/$version")
          foreach ($name in 'UI4ME', 'Ui4me', 'ui4me') {
            $output = @(pwsh -NoProfile -Command "`$env:PSModulePath='$root'; Import-Module $name -ErrorAction Stop; (Get-Module $name).ExportedFunctions.Count")
            $count = 0
            if ($LASTEXITCODE -ne 0 -or -not [int]::TryParse([string]$output[-1], [ref]$count) -or $count -lt 50) {
              throw "Import-Module $name failed from the Gallery layout: $($output -join ' ')"
            }
            "Import-Module $name -> $count commands"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ui4me-dist
          path: dist/*
          if-no-files-found: error
