name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 libegl1 libgl1
      - name: Pinned PowerShell host
        run: python .github/scripts/setup-powershell.py
      - name: Python build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Package manager
        shell: pwsh
        run: Install-PSResource Microsoft.PowerShell.PSResourceGet -Version 1.1.1 -Scope CurrentUser -TrustRepository
      - name: Prerequisite report
        run: python dev.py doctor
      - name: Build from committed dependency locks
        run: python dev.py build --binding all --profile release
      - name: Unit and binding contracts
        run: python dev.py test --binding all --suite unit --profile release
      - name: Platform packages
        run: python dev.py package --binding all --profile release
      - name: Evidence overview
        if: always()
        run: python dev.py report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: candidate-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-${{ matrix.rid }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: build-diagnostics-${{ matrix.rid }}
          path: |
            build/${{ matrix.rid }}/release/*.log
            build/${{ matrix.rid }}/release/build.json
          if-no-files-found: warn
          retention-days: 30

  assemble:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python .github/scripts/setup-powershell.py
      - shell: pwsh
        run: Install-PSResource Microsoft.PowerShell.PSResourceGet -Version 1.1.1 -Scope CurrentUser -TrustRepository
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-linux-x64
          path: dist/linux-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-win-x64
          path: dist/win-x64
      - run: python dev.py assemble --manifest dist/linux-x64/manifest.json --manifest dist/win-x64/manifest.json --out dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  installed:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        binding: [core, python, powershell]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Linux native runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libegl1 libgl1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: External C compiler environment
        if: runner.os == 'Windows' && matrix.binding == 'core'
        shell: pwsh
        run: ./.github/scripts/setup-msvc.ps1
      - run: python .github/scripts/setup-powershell.py
        if: matrix.binding == 'powershell'
      - shell: pwsh
        if: matrix.binding == 'powershell'
        run: Install-PSResource Microsoft.PowerShell.PSResourceGet -Version 1.1.1 -Scope CurrentUser -TrustRepository
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: dist/release
      - run: python dev.py test --binding ${{ matrix.binding }} --suite installed --manifest dist/release/manifest.json
      - run: python dev.py report --manifest dist/release/manifest.json
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-${{ matrix.os }}-${{ matrix.binding }}
          path: build/reports/
          if-no-files-found: error
          retention-days: 30

  bundle:
    needs: [build, assemble, installed]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: dist/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: unit-*
          path: build/reports
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installed-*
          path: build/reports
          merge-multiple: true
      - run: python dev.py report --manifest dist/release/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-bundle
          path: |
            dist/release/
            build/reports/
          if-no-files-found: error
          retention-days: 30
