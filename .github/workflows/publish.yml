name: Release and publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui4me-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ui4me/ui4me' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_HOME: ${{ github.workspace }}/build/ci-rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # Components from rust-toolchain.toml up front; an on-demand install conflicts with the image's cargo-fmt.
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # The runner's Azure apt mirror is sometimes unresolvable: use the Ubuntu archive with retries.
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          # Best effort: the native libraries are loaded at run time (wayland/x11 dlopen) and the
          # image has the toolchain; the build below fails loudly if something is really missing.
          if ! { sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 libegl1 libgl1; }; then
            echo "::warning::apt packages unavailable on this runner; continuing with the image's packages"
          fi
      - name: MSVC x64 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-msvc.ps1
      - run: python .github/scripts/setup-powershell.py
      - run: python -m pip install -r requirements-dev.txt
      - shell: pwsh
        run: Install-PSResource Microsoft.PowerShell.PSResourceGet -Version 1.1.1 -Scope CurrentUser -TrustRepository
      - run: python dev.py build --binding all --profile release
      # Mandatory checks: a failure here stops the release before anything is published.
      - run: python dev.py test --binding all --suite unit --profile release
      - run: python dev.py package --binding all --profile release
        env:
          # The Linux wheel keeps the 0.2/0.3 glibc floor; a newer requirement fails here.
          UI4ME_MANYLINUX_POLICY: ${{ matrix.rid == 'linux-x64' && 'manylinux_2_35_x86_64' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python .github/scripts/setup-powershell.py
      - shell: pwsh
        run: Install-PSResource Microsoft.PowerShell.PSResourceGet -Version 1.1.1 -Scope CurrentUser -TrustRepository
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-linux-x64
          path: dist/linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-win-x64
          path: dist/win-x64
      - run: python dev.py assemble --manifest dist/linux-x64/manifest.json --manifest dist/win-x64/manifest.json --out dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/release/
          if-no-files-found: error

  # The exact assembled packages, installed outside the checkout on both platforms: the Python
  # wheel, the PowerShell module (from the combined nupkg), the C SDK and (Linux) the Lua zip.
  smoke:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Linux native runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libx11-6 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libegl1 libgl1
      - name: C compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-msvc.ps1
      - run: python .github/scripts/setup-powershell.py
      - shell: pwsh
        run: Install-PSResource Microsoft.PowerShell.PSResourceGet -Version 1.1.1 -Scope CurrentUser -TrustRepository
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - run: python dev.py test --binding python --suite installed --manifest dist/release/manifest.json
      - run: python dev.py test --binding powershell --suite installed --manifest dist/release/manifest.json
      - run: python dev.py test --binding core --suite installed --manifest dist/release/manifest.json
      - name: LuaJIT binding from the release zip against the packaged native library
        if: runner.os == 'Linux'
        run: |
          version=$(tr -d '\r\n' < VERSION)
          bindings/lua/tools/build_luajit.sh
          mkdir -p build/lua-smoke && cd build/lua-smoke
          unzip -q "../../dist/release/ui4me-lua-$version.zip" && unzip -q "../../dist/release/ui4me-sdk-$version-linux-x64.zip" -d sdk
          UI4ME_INSTALLED=1 UI4ME_NATIVE_LIB="$PWD/$(cd sdk && find . -name libui4me_core.so | head -1)" LUA_PATH="$PWD/lua/?.lua;;" \
            ../luajit/src/luajit ../../tests/lua/test_ui4me.lua
      - run: python dev.py report --manifest dist/release/manifest.json
        if: always()

  pypi:
    needs: smoke
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Stage Python wheels
        run: mkdir -p dist/pypi && cp dist/release/*.whl dist/pypi/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/pypi/

  powershell:
    needs: smoke
    runs-on: ubuntu-22.04
    environment: psgallery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python .github/scripts/setup-powershell.py
      - shell: pwsh
        run: Install-PSResource Microsoft.PowerShell.PSResourceGet -Version 1.1.1 -Scope CurrentUser -TrustRepository
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Publish PowerShell package
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: ./scripts/publish-powershell.ps1 -PackagePath (Get-ChildItem dist/release/*.nupkg).FullName

  github:
    needs: [assemble, pypi, powershell]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          (cd dist/release && sha256sum -- * | grep -v ' SHA256SUMS$' > SHA256SUMS)
          notes="docs/release-notes/v$version.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          { cat "$notes"; printf '\n\nBuilt from commit %s. This workflow ran the unit tests and installed-package smoke tests of these exact files on Linux and Windows; the native desktop gate is run separately (docs/DEVELOPMENT.md).\n' "$GITHUB_SHA"; } > release-notes.md
          gh release create "v$version" dist/release/* --target "$GITHUB_SHA" --title "ui4me $version" --notes-file release-notes.md

  # The rockspec's source is the GitHub release asset, so LuaRocks comes last. An existing
  # version is never replaced.
  luarocks:
    needs: github
    runs-on: ubuntu-22.04
    environment: luarocks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Publish to LuaRocks
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: python .github/scripts/publish-luarocks.py dist/release

  report:
    if: always()
    needs: [build, assemble, smoke, pypi, powershell, github, luarocks]
    runs-on: ubuntu-22.04
    steps:
      - name: Release outcome
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, os, sys
          needs = json.load(sys.stdin)
          lines = ['| Job | Result |', '| --- | --- |'] + [f'| {k} | {v[\"result\"]} |' for k, v in needs.items()]
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          failed = [k for k, v in needs.items() if v['result'] != 'success']
          if failed:
              print('::error::Release incomplete; not successful: ' + ', '.join(failed))
              sys.exit(1)
          "
