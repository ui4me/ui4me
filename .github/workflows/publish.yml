name: Publish qualified release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Foundation CI run at this exact commit
        required: true
        type: string
      linux_evidence_run_id:
        description: Successful reviewed Linux native evidence collection run
        required: true
        type: string
      windows_evidence_run_id:
        description: Successful reviewed Windows native evidence collection run
        required: true
        type: string
      registry:
        description: One publication destination
        type: choice
        options: [testpypi, pypi, powershell, github]
        required: true
      execute:
        description: Actually publish after qualification; false only prepares and reviews
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ui4me-publish-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'ui4me/ui4me' && github.ref_name == github.event.repository.default_branch
    environment: release-review
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: python .github/scripts/trusted-run.py --run-id "$RUN_ID" --workflow ci.yml --artifact ci-bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.ci.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: .
      - id: linux
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.linux_evidence_run_id }}
        run: python .github/scripts/trusted-run.py --run-id "$RUN_ID" --workflow native-evidence.yml --artifact native-linux-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.linux.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.linux_evidence_run_id }}
          github-token: ${{ github.token }}
          path: .
      - id: windows
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.windows_evidence_run_id }}
        run: python .github/scripts/trusted-run.py --run-id "$RUN_ID" --workflow native-evidence.yml --artifact native-win-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.windows.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.windows_evidence_run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Recompute qualification from the final files and complete evidence
        env:
          REVIEWER: ${{ github.actor }}
          REVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python dev.py qualify --manifest dist/release/manifest.json --reviewer "$REVIEWER" --review-url "$REVIEW_URL"
      - name: Review publication command
        env:
          REGISTRY: ${{ inputs.registry }}
        run: python dev.py publish --manifest dist/release/manifest.json --registry "$REGISTRY"
      - run: python dev.py report --manifest dist/release/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-release
          path: |
            dist/release/
            build/reports/
          if-no-files-found: error
          retention-days: 90

  python:
    needs: qualify
    if: inputs.execute && (inputs.registry == 'pypi' || inputs.registry == 'testpypi')
    runs-on: ubuntu-22.04
    environment: ${{ inputs.registry }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libegl1 libgl1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-release
          path: .
      - run: python .github/scripts/stage-python-release.py
        id: python_stage
        env:
          REGISTRY: ${{ inputs.registry }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        if: steps.python_stage.outputs.has_pending == 'true'
        with:
          packages-dir: build/pypi/
          repository-url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  python-verify:
    # The publishing action runs in a container and can leave files in its
    # checkout. Verify in a fresh job so source identity remains meaningful.
    needs: [qualify, python]
    if: inputs.execute && (inputs.registry == 'pypi' || inputs.registry == 'testpypi')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libegl1 libgl1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-release
          path: .
      - name: Verify public download and current-host installed consumer
        env:
          REGISTRY: ${{ inputs.registry }}
        run: python dev.py verify --manifest dist/release/manifest.json --registry "$REGISTRY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-verification-${{ inputs.registry }}
          path: |
            build/public-verification/
            build/reports/
          retention-days: 90

  other:
    needs: qualify
    if: inputs.execute && (inputs.registry == 'powershell' || inputs.registry == 'github')
    runs-on: ubuntu-22.04
    environment: ${{ inputs.registry == 'powershell' && 'psgallery' || 'github-release' }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libegl1 libgl1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python .github/scripts/setup-powershell.py
      - shell: pwsh
        run: Install-PSResource Microsoft.PowerShell.PSResourceGet -Version 1.1.1 -Scope CurrentUser -TrustRepository
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-release
          path: .
      - name: Publish the qualified bytes
        env:
          REGISTRY: ${{ inputs.registry }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python dev.py publish --manifest dist/release/manifest.json --registry "$REGISTRY" --execute
      - name: Verify public download and current-host installed consumer
        env:
          REGISTRY: ${{ inputs.registry }}
          GH_TOKEN: ${{ github.token }}
        run: python dev.py verify --manifest dist/release/manifest.json --registry "$REGISTRY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-verification-${{ inputs.registry }}
          path: |
            build/publish/
            build/public-verification/
            build/reports/
          retention-days: 90
